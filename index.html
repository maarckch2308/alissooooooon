<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aplasta las burbujas</title>
<style>
:root{
  --bg1:#fbe3f0;--bg2:#cfe3ff;--bg3:#e6d9ff;
  --text:#4a2c5e;--slot:rgba(255,255,255,.55);--slot-b:rgba(120,80,160,.25);--glow:#e0489b;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg1:#2a1245;--bg2:#10224d;--bg3:#3b1a5a;--text:#fff;--slot:rgba(255,255,255,.08);--slot-b:rgba(255,255,255,.25);--glow:#ff7ac6;}}
:root[data-theme="dark"]{--bg1:#2a1245;--bg2:#10224d;--bg3:#3b1a5a;--text:#fff;--slot:rgba(255,255,255,.08);--slot-b:rgba(255,255,255,.25);--glow:#ff7ac6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"Poppins","Segoe UI",system-ui,sans-serif;color:var(--text);
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));background-size:300% 300%;
  animation:bg 14s ease infinite;touch-action:manipulation;user-select:none;-webkit-user-select:none}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:clamp(14px,4vh,40px) 12px 0;text-align:center;z-index:5;pointer-events:none}
#hint{margin:0 0 14px;font-size:clamp(14px,3.6vw,20px);opacity:.85;transition:opacity .5s}
#slots{display:flex;justify-content:center;gap:clamp(6px,2vw,14px)}
.slot{width:clamp(38px,12vw,70px);height:clamp(50px,15vw,88px);border-radius:16px;background:var(--slot);
  border:2px dashed var(--slot-b);display:flex;align-items:center;justify-content:center;
  font-size:clamp(28px,9vw,54px);font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.slot span{opacity:0;transform:scale(.2) rotate(-30deg);transition:all .5s cubic-bezier(.3,1.8,.5,1)}
.slot.on{border-style:solid;border-color:var(--glow);box-shadow:0 0 22px var(--glow)}
.slot.on span{opacity:1;transform:none}
.bubble{position:fixed;left:0;top:0;border-radius:50%;cursor:pointer;z-index:3;will-change:transform;
  background:
   radial-gradient(circle at 30% 28%,rgba(255,255,255,.95) 0 8%,transparent 20%),
   radial-gradient(circle at 70% 75%,rgba(255,255,255,.35) 0 6%,transparent 22%),
   radial-gradient(circle at 50% 50%,rgba(255,255,255,.04) 55%,rgba(255,150,230,.35) 78%,rgba(120,200,255,.55) 100%);
  border:2px solid rgba(255,255,255,.65);box-shadow:inset 0 0 22px rgba(255,255,255,.4),0 8px 30px rgba(120,80,200,.25)}
.bubble::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--s) * .38);font-weight:700;color:rgba(255,255,255,.75);text-shadow:0 2px 8px rgba(120,80,200,.4)}
.bubble.pop{pointer-events:none}
.fly{position:fixed;z-index:9;font-weight:700;pointer-events:none;color:var(--text);text-shadow:0 0 18px var(--glow)}
.part{position:fixed;z-index:8;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff,rgba(255,150,230,.8))}
.heart{position:fixed;top:-40px;z-index:7;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
#end{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);text-align:center;z-index:6;
  opacity:0;transform:translateY(20px);transition:all .8s;pointer-events:none}
#end.show{opacity:1;transform:none;pointer-events:auto}
#end p{margin:0 0 14px;font-size:clamp(18px,5vw,28px);font-weight:600}
#cat{position:fixed;left:50%;top:50%;width:min(72vw,360px);border-radius:28px;z-index:6;pointer-events:none;border:4px solid rgba(255,255,255,.85);box-shadow:0 0 40px var(--glow),0 12px 40px rgba(0,0,0,.25);opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-8deg);transition:all .9s cubic-bezier(.3,1.6,.5,1)}
#cat.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);animation:bob 3s ease-in-out .9s infinite}
@keyframes bob{50%{transform:translate(-50%,-52%) scale(1.03)}}
#end{bottom:calc(env(safe-area-inset-bottom,0px) + 5vh)}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:12px 28px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#ff7ac6,#8b6bff);box-shadow:0 8px 24px rgba(139,107,255,.45)}
button:active{transform:scale(.96)}
.spark{position:fixed;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.6;animation:tw 3s infinite;pointer-events:none}
@keyframes tw{50%{opacity:0;transform:scale(2)}}
</style>
</head>
<body>
<div id="top">
  <p id="hint">Aplasta las burbujas ✨</p>
  <div id="slots"></div>
</div>
<img id="cat" alt="Perdón" src="WhatsApp Sticker 2026-10-12 at 7.10.34 PM.jpeg">
<div id="end"><p>Pido perdón 🥺</p></div>

<script>
const WORD = "PERDÓN";
const slotsEl = document.getElementById('slots');
const endEl = document.getElementById('end');
const hintEl = document.getElementById('hint');
let bubbles = [], popped = 0, W = innerWidth, H = innerHeight, last = 0, running = false;

// destellos de fondo
for(let i=0;i<24;i++){const s=document.createElement('div');s.className='spark';
  s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';
  s.style.animationDelay=Math.random()*3+'s';document.body.appendChild(s);}

function size(){ return Math.max(68, Math.min(112, Math.min(W,H)*0.2)); }

function build(){
  bubbles.forEach(b=>b.el.remove()); bubbles=[]; popped=0;
  slotsEl.innerHTML=''; endEl.classList.remove('show');document.getElementById('cat').classList.remove('show'); hintEl.style.opacity=1;
  W=innerWidth; H=innerHeight;
  [...WORD].forEach((ch,i)=>{
    const s=document.createElement('div');s.className='slot';s.innerHTML='<span>'+ch+'</span>';slotsEl.appendChild(s);
  });
  const S=size(), top=Math.max(150,H*0.28);
  [...WORD].forEach((ch,i)=>{
    const el=document.createElement('div');el.className='bubble';
    el.style.width=el.style.height=S+'px';el.style.setProperty('--s',S+'px');
    document.body.appendChild(el);
    const sp=40+Math.random()*50, a=Math.random()*Math.PI*2;
    const b={el,ch,i,S,x:Math.random()*(W-S),y:top+Math.random()*Math.max(10,H-top-S),
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,ph:Math.random()*6,done:false};
    el.addEventListener('pointerdown',e=>{e.preventDefault();pop(b);});
    bubbles.push(b);
  });
  if(!running){running=true;requestAnimationFrame(tick);}
}

function tick(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  const top=Math.max(130,H*0.24);
  bubbles.forEach(b=>{
    if(b.done)return;
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.ph+=dt*2;
    if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}
    if(b.x>W-b.S){b.x=W-b.S;b.vx=-Math.abs(b.vx)}
    if(b.y<top){b.y=top;b.vy=Math.abs(b.vy)}
    if(b.y>H-b.S){b.y=H-b.S;b.vy=-Math.abs(b.vy)}
    const sx=1+Math.sin(b.ph)*.04, sy=1+Math.cos(b.ph)*.04;
    b.el.style.transform=`translate(${b.x}px,${b.y}px) scale(${sx},${sy})`;
  });
  requestAnimationFrame(tick);
}

function pop(b){
  if(b.done)return; b.done=true; b.el.classList.add('pop');
  const cx=b.x+b.S/2, cy=b.y+b.S/2;
  b.el.animate([{opacity:1,transform:b.el.style.transform},
    {opacity:1,transform:b.el.style.transform+' scale(1.25)',offset:.4},
    {opacity:0,transform:b.el.style.transform+' scale(1.6)'}],{duration:260,fill:'forwards'})
    .onfinish=()=>b.el.remove();
  // partículas
  for(let k=0;k<18;k++){
    const p=document.createElement('div');p.className='part';
    const d=4+Math.random()*7;p.style.width=p.style.height=d+'px';
    p.style.left=cx+'px';p.style.top=cy+'px';document.body.appendChild(p);
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*b.S*.8;
    p.animate([{transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist}px) scale(.2)`,opacity:0}],
      {duration:600+Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();
  }
  // letra vuela hacia su casilla
  const slot=slotsEl.children[b.i], r=slot.getBoundingClientRect();
  const f=document.createElement('div');f.className='fly';f.textContent=b.ch;
  f.style.left=cx+'px';f.style.top=cy+'px';f.style.fontSize=b.S*.7+'px';
  f.style.transform='translate(-50%,-50%)';document.body.appendChild(f);
  const tx=r.left+r.width/2, ty=r.top+r.height/2;
  const anim=f.animate([
    {left:cx+'px',top:cy+'px',transform:'translate(-50%,-50%) scale(.3)',opacity:0},
    {left:cx+'px',top:cy+'px',transform:'translate(-50%,-50%) scale(1.2)',opacity:1,offset:.3},
    {left:tx+'px',top:ty+'px',transform:'translate(-50%,-50%) scale(.6)',opacity:1}
  ],{duration:900,easing:'ease-in-out',fill:'forwards'});
  anim.onfinish=()=>{f.remove();slot.classList.add('on');
    slot.animate([{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:350});
    popped++; if(popped===bubbles.length)finish();};
  if(navigator.vibrate)navigator.vibrate(15);
}

function finish(){
  hintEl.style.opacity=0;
  endEl.classList.add('show');document.getElementById('cat').classList.add('show');
  const em=['🥺','🥺','🥺','','✨'];
  for(let i=0;i<40;i++){
    const h=document.createElement('div');h.className='heart';h.textContent=em[i%em.length];
    h.style.left=Math.random()*100+'vw';h.style.fontSize=(16+Math.random()*22)+'px';
    h.style.animationDuration=(3+Math.random()*3)+'s';h.style.animationDelay=Math.random()*1.5+'s';
    document.body.appendChild(h);setTimeout(()=>h.remove(),7000);
  }
}

addEventListener('resize',()=>{W=innerWidth;H=innerHeight;bubbles.forEach(b=>{if(!b.done){b.x=Math.min(b.x,W-b.S);b.y=Math.min(b.y,H-b.S);}});});
build();
</script>
</body>
</html>
